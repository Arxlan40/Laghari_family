<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Laghari Clan Genealogy Application">
  <meta name="google-signin-client_id" content="1048000775904-web.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Laghari Family">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>Laghari Family Tree | شجرہ نسب لغاری خاندان</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pre-load Firebase JS SDK v11.9.1 (the exact version firebase_core_web 2.24.1 expects).
    This prevents the plugin from dynamically injecting scripts via document.head!.appendChild(),
    which crashes on iOS WebKit because document.head can be null during early page load.
    firebase_core_web checks: if (globalContext.getProperty('firebase_core'.toJS) != null) return;
    So setting window.firebase_core makes it skip the buggy injection entirely.
  -->
  <script type="module">
    import * as firebase_core from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
    import * as firebase_auth from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js';
    import * as firebase_firestore from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';
    import * as firebase_storage from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js';
    import * as firebase_analytics from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-analytics.js';
    import * as firebase_messaging from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-messaging.js';
    window.firebase_core = firebase_core;
    window.firebase_auth = firebase_auth;
    window.firebase_firestore = firebase_firestore;
    window.firebase_storage = firebase_storage;
    window.firebase_analytics = firebase_analytics;
    window.firebase_messaging = firebase_messaging;
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app-loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0b0f19;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .crest-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #d4af37;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
      margin-bottom: 20px;
      object-fit: cover;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .app-title {
      margin-top: 16px;
      color: #d4af37;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading-screen">
    <img src="icons/Icon-192.png" alt="Laghari Family Crest" class="crest-avatar">
    <div class="spinner"></div>
    <div class="app-title">شجرہ نسب لغاری خاندان</div>
  </div>
  <script>
    function removeAppLoadingScreen() {
      var loader = document.getElementById('app-loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', removeAppLoadingScreen);
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
        setTimeout(removeAppLoadingScreen, 150);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(removeAppLoadingScreen, 3000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
